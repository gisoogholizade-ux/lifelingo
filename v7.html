<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>LifeLingo V7.1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="./v6.html?v=5c8788cd" title="LifeLingo"></iframe><script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
 const d=frame.contentDocument;if(!d)return;
 const style=d.createElement('style');style.id='cinematicPatch';style.textContent=`
 .mission{overflow:hidden}.mission::after{content:'PLAY  →';position:absolute;right:14px;bottom:14px;padding:8px 11px;border-radius:10px;background:#35dfcf14;border:1px solid #35dfcf55;color:#bffcf5;font-size:11px;font-weight:900;letter-spacing:.06em}.mission.done::after{content:'REPLAY  →';background:#53df8812;border-color:#53df8855;color:#c9ffdb}.mission.locked::after,.mission:disabled::after{content:'LOCKED  🔒';background:#ffffff07;border-color:#ffffff18;color:#7f8aa7}.mission:not(:disabled){box-shadow:inset 0 0 0 1px #35dfcf08}.mission:not(:disabled):active{transform:scale(.985)}
 .environment{position:relative;overflow:hidden;isolation:isolate;transition:background .5s ease}.environment:before,.environment:after{content:'';position:absolute;pointer-events:none;z-index:-1}.environment:before{inset:0;background:linear-gradient(90deg,transparent,#ffffff08,transparent);transform:translateX(-110%);animation:roomSweep 7s ease-in-out infinite}.environment:after{left:8%;right:8%;bottom:13%;height:4px;background:#ffffff10;box-shadow:0 24px 35px #0008}.npcAvatar{position:relative;z-index:3;animation:npcIdle 2.7s ease-in-out infinite;transform-origin:50% 100%}.npcAvatar:after{content:'';position:absolute;width:80%;height:14px;left:10%;bottom:-22px;border-radius:50%;background:#0007;filter:blur(5px);z-index:-1}.cinematic-prop{position:absolute;z-index:2;pointer-events:none;filter:drop-shadow(0 14px 10px #0007)}.cinematic-hand{position:absolute;z-index:5;width:92px;height:48px;border-radius:45% 45% 36% 36%;background:linear-gradient(145deg,#d6a27f,#9a654d);bottom:-55px;left:18%;transform:rotate(-8deg);opacity:0}.cinematic-passport{width:64px;height:88px;border-radius:5px;background:linear-gradient(145deg,#273a70,#121d42);border:2px solid #a99a56;left:23%;bottom:17%;opacity:0}.cinematic-passport:after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#c9b865;font-size:25px}.cinematic-stamp{width:55px;height:62px;border-radius:8px;background:linear-gradient(#4c4540 0 34%,#7d2424 34%);right:17%;bottom:20%;opacity:0}.cinematic-phone{width:47px;height:82px;border:4px solid #1a1c22;border-radius:9px;background:linear-gradient(#bceeff,#66b8d5);left:21%;bottom:18%;opacity:0}.cinematic-card{width:78px;height:48px;border-radius:7px;background:linear-gradient(135deg,#403e88,#8b6ee5);left:22%;bottom:18%;opacity:0}.cinematic-bag{width:72px;height:70px;border-radius:6px 6px 16px 16px;background:#d9c59a;left:20%;bottom:15%;opacity:0}.cinematic-laptop{width:115px;height:68px;border:5px solid #252a35;border-radius:6px;background:linear-gradient(#6e8cb2,#283b5a);left:12%;bottom:14%;opacity:0}.cinematic-menu{width:80px;height:100px;background:#eee0bb;border:3px solid #6c563b;left:20%;bottom:14%;opacity:0}.cinematic-key{font-size:58px;left:22%;bottom:16%;opacity:0}
 .environment.cine-passport .cinematic-passport{animation:passportGive 2.2s ease both}.environment.cine-passport .cinematic-hand{animation:handGive 2.2s ease both}.environment.cine-passport .cinematic-stamp{animation:stampMove 2.2s 2.3s ease both}.environment.cine-sim .cinematic-phone,.environment.cine-hotel .cinematic-key,.environment.cine-restaurant .cinematic-menu,.environment.cine-career .cinematic-laptop,.environment.cine-bank .cinematic-card,.environment.cine-supermarket .cinematic-bag{animation:propPresent 1.1s .25s ease both}
 @keyframes npcIdle{50%{transform:translateY(-4px)}}@keyframes roomSweep{0%,55%{transform:translateX(-110%)}80%,100%{transform:translateX(110%)}}@keyframes passportGive{0%{opacity:0;transform:translate(-90px,80px) rotate(-18deg)}35%{opacity:1;transform:translate(0,0) rotate(-8deg)}70%,100%{opacity:1;transform:translate(105px,-42px) rotate(2deg)}}@keyframes handGive{0%{opacity:0;transform:translate(-90px,70px)}25%,62%{opacity:1;transform:translate(0,-80px)}100%{opacity:0;transform:translate(-60px,30px)}}@keyframes stampMove{0%{opacity:0;transform:translate(60px,-50px)}35%{opacity:1;transform:translate(0,-55px)}55%{transform:translate(-85px,5px) rotate(-12deg)}68%{transform:translate(-85px,28px) rotate(-12deg)}80%,100%{opacity:1;transform:translate(0,-55px)}}@keyframes propPresent{0%{opacity:0;transform:translateY(65px) rotate(-8deg)}70%,100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.environment:before,.npcAvatar,.cinematic-prop,.cinematic-hand{animation:none!important}}
 `;d.head.appendChild(style);
 function ensureProps(){const env=d.querySelector('.environment');if(!env||env.dataset.cineReady)return;env.dataset.cineReady='1';[['cinematic-hand',''],['cinematic-passport',''],['cinematic-stamp',''],['cinematic-phone',''],['cinematic-card',''],['cinematic-bag',''],['cinematic-laptop',''],['cinematic-menu',''],['cinematic-key','🔑']].forEach(([c,t])=>{const e=d.createElement('div');e.className='cinematic-prop '+c;e.textContent=t;env.appendChild(e)})}
 function applyScene(){const env=d.querySelector('.environment');if(!env||!d.querySelector('.conversation.show'))return;ensureProps();const txt=((d.getElementById('place')?.textContent||'')+' '+(d.getElementById('npcName')?.textContent||'')+' '+(d.getElementById('question')?.textContent||d.getElementById('npcLine')?.textContent||'')).toLowerCase();[...env.classList].filter(x=>x.startsWith('cine-')).forEach(x=>env.classList.remove(x));let c='cine-career';if(/passport|immigration|airport.*officer/.test(txt))c='cine-passport';else if(/sim|mobile/.test(txt))c='cine-sim';else if(/supermarket|cashier|grocer/.test(txt))c='cine-supermarket';else if(/bank/.test(txt))c='cine-bank';else if(/hotel|reception/.test(txt))c='cine-hotel';else if(/restaurant|server|food|order/.test(txt))c='cine-restaurant';else if(/taxi|driver|street|direction/.test(txt))c='cine-taxi';else if(/doctor|clinic/.test(txt))c='cine-doctor';env.classList.add(c)}
 // Event delegation keeps working even when mission cards are re-rendered.
 d.addEventListener('click',e=>{const card=e.target.closest?.('.mission:not(:disabled)');if(card){setTimeout(applyScene,120)}});
 // Only watch text/child changes while a conversation is open. No attribute observation => no self-trigger loop.
 let timer;const observer=new MutationObserver(()=>{if(!d.querySelector('.conversation.show'))return;clearTimeout(timer);timer=setTimeout(applyScene,60)});observer.observe(d.body,{subtree:true,childList:true,characterData:true});
});
</script></body></html>
