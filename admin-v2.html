<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>LifeLingo Admin</title><style>:root{--bg:#08101f;--card:#111b2f;--card2:#17243c;--text:#f7f9ff;--muted:#9aa8c0;--line:#ffffff18;--gold:#ffbd4a;--ok:#5cdb93;--red:#ff7b88}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#302512 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.wrap{max-width:1160px;margin:auto;padding:16px}.auth{width:min(460px,calc(100% - 24px));margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#ffb51514;border:1px solid #ffb51544;color:#ffd56b;font-size:11px;font-weight:900;letter-spacing:.08em}.muted{color:var(--muted)}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:13px;background:#090f20;color:#fff;outline:none}input:focus,select:focus{border-color:#ffb51577}.btn{border:0;border-radius:13px;padding:11px 13px;background:var(--gold);color:#111827;font-weight:900;cursor:pointer}.ghost{background:#ffffff09;color:#fff;border:1px solid var(--line)}.danger{background:var(--red);color:#1b0e12}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.msg{min-height:21px;margin-top:9px;color:#ffd56b;font-size:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:var(--card2);padding:16px;border-radius:18px}.stat b{display:block;font-size:28px}.tr{display:grid;grid-template-columns:1.1fr 1fr .75fr 1.25fr;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.small{font-size:11px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab.on{background:var(--gold);color:#111827}.badge{display:inline-flex;padding:6px 8px;border-radius:999px;background:#ffffff0b;font-size:11px}.pro{color:#ffd56b;border:1px solid #ffb51544}.search{display:flex;gap:8px;margin:12px 0}.search input{max-width:420px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.tr{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.stats{grid-template-columns:1fr}.wrap{padding:10px}}.authActionStatus{width:100%;min-height:18px;font-size:11px;color:var(--muted)}.authActionStatus.ok{color:var(--ok)}.authActionStatus.error{color:var(--red)}button:disabled{opacity:.55;cursor:wait}</style><link rel="stylesheet" href="./v66-admin-unified.css?v=846a7b9d"><link rel="stylesheet" href="./lifelingo-color-system.css?v=1"></head><body><section id="authBox" class="auth"><span class="pill">LIFELINGO ADMIN</span><h2>Admin access</h2><p class="muted">Sign in with an authorized LifeLingo account.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password" style="margin-top:8px"><button id="loginBtn" class="btn" style="width:100%;margin-top:10px">Log in</button><div class="row" style="margin-top:8px"><button id="magicBtn" class="btn ghost">Send my login link</button><button id="resetBtn" class="btn ghost">Send password reset</button></div><div id="authMsg" class="msg"></div></section><main id="app" class="wrap hidden"><div class="top"><div><span class="pill">PRODUCTION MVP</span><h1 style="margin:7px 0">LifeLingo Admin</h1></div><div class="row"><span id="who" class="muted"></span><button id="logout" class="btn ghost">Log out</button></div></div><div class="stats"><div class="stat"><span class="muted">Users</span><b id="mTotal">0</b></div><div class="stat"><span class="muted">Free</span><b id="mFree">0</b></div><div class="stat"><span class="muted">Active Pro</span><b id="mPro">0</b></div><div class="stat"><span class="muted">Pending</span><b id="mPending">0</b></div><div class="stat"><span class="muted">New · 7d</span><b id="mRecent">0</b></div></div><section class="card"><div class="tabs"><button class="btn tab on" data-tab="users">Users</button><button class="btn ghost tab" data-tab="requests">Upgrade Requests</button></div><div id="usersTab"><div class="search"><input id="search" placeholder="Search name, email or mobile"><button id="searchBtn" class="btn ghost">Search</button></div><div id="users"></div></div><div id="requestsTab" class="hidden"><div id="requests"></div></div></section></main><script src="./supabase-client.js?v=3"></script><script>let sb=null,session=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const msg=t=>$('#authMsg').textContent=t;function ui(on){$('#authBox').classList.toggle('hidden',on);$('#app').classList.toggle('hidden',!on);if(on)$('#who').textContent=session?.user?.email||''}async function boot(){if(!window.llSupabase){setTimeout(boot,80);return}sb=window.llSupabase;session=(await sb.auth.getSession()).data.session;ui(!!session);if(session)await load();sb.auth.onAuthStateChange((_e,s)=>{session=s;ui(!!s);if(s)load()})}async function load(search=''){const [m,u,r]=await Promise.all([sb.rpc('admin_dashboard_metrics'),sb.rpc('admin_users_v2',{p_search:search||null}),sb.rpc('admin_upgrade_requests_v2')]);if(m.error||u.error||r.error){ui(false);msg('This account is not authorized for admin access.');return}const x=m.data||{};$('#mTotal').textContent=x.total_users||0;$('#mFree').textContent=x.free_users||0;$('#mPro').textContent=x.active_pro||0;$('#mPending').textContent=x.pending_requests||0;$('#mRecent').textContent=x.recent_registrations||0;renderUsers(u.data||[]);renderRequests(r.data||[])}function renderUsers(a){$('#users').innerHTML=a.map(u=>`<div class="tr"><div><b>${esc(u.display_name||'Unnamed')}</b><div class="muted small">${esc(u.created_at?new Date(u.created_at).toLocaleDateString():'')}</div></div><div><b>${esc(u.email||'')}</b><div class="muted small">${esc(u.phone||'No mobile')}</div></div><div><span class="badge ${u.plan==='pro'?'pro':''}">${esc(u.status==='expired'?'expired':u.plan)}</span></div><div class="small">${u.expires_at?'Until '+esc(new Date(u.expires_at).toLocaleDateString()):'—'}</div><div class="row"><select data-days="${u.user_id}" style="max-width:115px"><option value="30">1 month</option><option value="90">3 months</option><option value="180">6 months</option><option value="365">1 year</option></select><button class="btn" data-pro="${u.user_id}">Activate / extend</button><button class="btn ghost" data-auth-action="send_magic_link" data-user-id="${u.user_id}">Send login link</button><button class="btn ghost" data-auth-action="send_password_reset" data-user-id="${u.user_id}">Reset password</button><button class="btn ghost" data-auth-action="resend_confirmation" data-user-id="${u.user_id}">Resend confirmation</button><div class="authActionStatus" data-auth-status="${u.user_id}" role="status" aria-live="polite"></div></div></div>`).join('')||'<p class="muted">No users found.</p>'}function renderRequests(a){$('#requests').innerHTML=a.map(r=>`<div class="tr"><div><b>${esc(r.display_name||'')}</b><div class="muted small">${esc(r.created_at?new Date(r.created_at).toLocaleString():'')}</div></div><div><b>${esc(r.email||'')}</b><div class="muted small">${esc(r.phone||'No mobile')}</div></div><div><span class="badge">${esc(r.status)}</span></div><div>${esc(r.desired_term)}</div><div class="row">${['open','contacted','paid'].includes(r.status)?`<button class="btn" data-activate="${r.user_id}" data-term="${r.desired_term}">Approve + activate</button><button class="btn danger" data-reject="${r.request_id}">Reject</button>`:'<span class="muted small">Closed</span>'}</div></div>`).join('')||'<p class="muted">No upgrade requests.</p>'}function setButtonState(button,busy,busyText){if(!button)return;if(!button.dataset.idleText)button.dataset.idleText=button.textContent;button.disabled=busy;button.textContent=busy?busyText:button.dataset.idleText}
function safeAuthMessage(error,fallback){if(!error)return fallback;if(error.status===429||/rate|too many/i.test(error.message||''))return 'Too many requests. Please wait and try again.';return error.message||fallback}
$('#loginBtn').onclick=async()=>{const button=$('#loginBtn');setButtonState(button,true,'Signing in…');msg('');try{const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim().toLowerCase(),password:$('#password').value});if(error)throw error;session=data.session;ui(true);await load()}catch(error){msg(safeAuthMessage(error,'Could not sign in.'))}finally{setButtonState(button,false)}};
$('#magicBtn').onclick=async()=>{const button=$('#magicBtn'),email=$('#email').value.trim().toLowerCase();if(!email)return msg('Enter your email first.');setButtonState(button,true,'Sending…');msg('');try{const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:new URL('./admin.html',location.href).href}});if(error)throw error;msg('Secure login link sent. Check your inbox.')}catch(error){msg(safeAuthMessage(error,'Could not send the login link.'))}finally{setButtonState(button,false)}};
$('#resetBtn').onclick=async()=>{const button=$('#resetBtn'),email=$('#email').value.trim().toLowerCase();if(!email)return msg('Enter your email first.');setButtonState(button,true,'Sending…');msg('');try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:new URL('./reset-password.html',location.href).href});if(error)throw error;msg('Password recovery email sent. Check your inbox.')}catch(error){msg(safeAuthMessage(error,'Could not send the password recovery email.'))}finally{setButtonState(button,false)}};
$('#logout').onclick=()=>sb.auth.signOut();$('#searchBtn').onclick=()=>load($('#search').value.trim());$('#search').addEventListener('keydown',e=>{if(e.key==='Enter')load($('#search').value.trim())});async function runAdminAuthAction(button){const action=button.dataset.authAction,userId=button.dataset.userId,status=document.querySelector(`[data-auth-status="${userId}"]`);const labels={send_magic_link:'Send a secure login link to this user?',send_password_reset:'Send a password recovery email to this user?',resend_confirmation:'Resend the signup confirmation email to this user?'};if(!action||!userId||!confirm(labels[action]||'Continue?'))return;status.className='authActionStatus';status.textContent='Sending…';setButtonState(button,true,'Sending…');try{const {data,error}=await sb.functions.invoke('admin-auth-action',{body:{action,targetUserId:userId}});if(error){let detail=error.message;try{const body=await error.context?.json();if(body?.error)detail=body.error}catch{}throw new Error(detail)}if(!data?.ok)throw new Error(data?.error||'The server did not confirm this action.');status.className='authActionStatus ok';status.textContent=data.message||'Completed.'}catch(error){status.className='authActionStatus error';status.textContent=safeAuthMessage(error,'Could not complete this action.')}finally{setButtonState(button,false)}}
document.addEventListener('click',async e=>{const authButton=e.target.closest('[data-auth-action]');if(authButton){await runAdminAuthAction(authButton);return}const p=e.target.closest('[data-pro]');if(p){if(!confirm('Activate or extend Pro for this user?'))return;p.disabled=true;try{const days=+document.querySelector(`[data-days="${p.dataset.pro}"]`).value;const {error}=await sb.rpc('admin_activate_pro',{p_user:p.dataset.pro,p_days:days,p_note:'Manual admin activation'});if(error)throw error;await load($('#search').value.trim())}catch(error){alert(safeAuthMessage(error,'Could not update this plan.'))}finally{p.disabled=false}return}const a=e.target.closest('[data-activate]');if(a){if(!confirm('Approve this request and activate Pro?'))return;a.disabled=true;try{const days={'1_month':30,'3_months':90,'6_months':180,'1_year':365}[a.dataset.term]||30;const {error}=await sb.rpc('admin_activate_pro',{p_user:a.dataset.activate,p_days:days,p_note:'Approved upgrade request'});if(error)throw error;await load()}catch(error){alert(safeAuthMessage(error,'Could not approve this request.'))}finally{a.disabled=false}return}const r=e.target.closest('[data-reject]');if(r){if(!confirm('Reject this upgrade request?'))return;r.disabled=true;try{const {error}=await sb.rpc('admin_reject_upgrade_request',{p_id:+r.dataset.reject});if(error)throw error;await load()}catch(error){alert(safeAuthMessage(error,'Could not reject this request.'))}finally{r.disabled=false}}});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('on',x===b);x.classList.toggle('ghost',x!==b)});$('#usersTab').classList.toggle('hidden',b.dataset.tab!=='users');$('#requestsTab').classList.toggle('hidden',b.dataset.tab!=='requests')});boot()</script></body></html>
