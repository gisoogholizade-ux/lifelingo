<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="theme-color" content="#050814"><title>LifeLingo — Secure Login</title><style>:root{--bg:#050814;--panel:#0d142a;--text:#f8f9ff;--muted:#9caac9;--p:#806cff;--c:#35dfcf;--g:#53df88;--r:#ff7185;--line:#ffffff18}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 85% 0,#30245e55,transparent 30%),var(--bg);color:var(--text)}button,input{font:inherit}.gate{position:fixed;inset:0;display:grid;place-items:center;padding:18px}.card{width:min(470px,100%);padding:25px;border:1px solid var(--line);border-radius:28px;background:#0c1227;box-shadow:0 35px 110px #000a}.logo{font-size:32px;font-weight:950}.logo span{color:var(--c)}.tag{color:var(--c);font-size:11px;font-weight:900;letter-spacing:.15em;margin-top:6px}.tabs{display:flex;gap:8px;margin:20px 0 14px}.tab,.btn{border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:#fff;padding:11px 14px;cursor:pointer}.tab{flex:1}.tab.active,.primary{border-color:transparent;background:linear-gradient(135deg,var(--p),#5841d8);font-weight:850}.field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#050a17;color:#fff;outline:none}.field input:focus{border-color:#806cff88}.msg{min-height:38px;color:var(--muted);font-size:12px;line-height:1.55;margin-top:11px}.msg.err{color:#ffb3be}.msg.ok{color:#b7ffd0}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin:12px 0}.dot{width:8px;height:8px;border-radius:50%;background:#ffc857}.dot.ok{background:var(--g)}.dot.bad{background:var(--r)}.game{position:fixed;inset:0;display:none;background:var(--bg)}.game.show{display:block}.game iframe{width:100%;height:100%;border:0;display:block}.loading{opacity:.65;pointer-events:none}</style></head><body><main id="gate" class="gate"><section class="card"><div class="logo">Life<span>Lingo</span></div><div class="tag">REAL ACCOUNT · JWT · DATABASE</div><div class="status"><span id="dot" class="dot"></span><span id="apiStatus">Checking secure API…</span></div><div class="tabs"><button class="tab active" data-mode="login">Log in</button><button class="tab" data-mode="signup">Sign up</button></div><div class="field" id="nameField" style="display:none"><label>Name</label><input id="name" autocomplete="name" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters"></div><button id="submit" class="btn primary" style="width:100%">Log in</button><div id="msg" class="msg">You need a real account before entering the game.</div></section></main><section id="game" class="game"><iframe id="frame" title="LifeLingo game"></iframe></section><script>const API='https://lifelingo-api-gisoo.onrender.com';const $=id=>document.getElementById(id);let mode='login',loggingOut=false;function setMsg(text,type=''){$('msg').textContent=text;$('msg').className='msg '+type}function setApi(ok,text){$('apiStatus').textContent=text;$('dot').className='dot '+(ok?'ok':'bad')}async function req(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};const access=localStorage.getItem('lifelingo_access');if(access)headers.Authorization='Bearer '+access;const r=await fetch(API+path,{...options,headers});let body=null;try{body=await r.json()}catch{}if(!r.ok){const detail=body?.message||body?.error||body?.detail||('HTTP '+r.status);throw new Error(detail)}return body}async function health(){try{const r=await fetch(API+'/actuator/health',{cache:'no-store'});if(r.ok){setApi(true,'Secure API online');return true}}catch{}setApi(false,'Secure API is not deployed yet');return false}function saveSession(result){localStorage.setItem('lifelingo_access',result.accessToken);localStorage.setItem('lifelingo_refresh',result.refreshToken);localStorage.setItem('lifelingo_user',JSON.stringify(result.user))}function clearSession(){localStorage.removeItem('lifelingo_access');localStorage.removeItem('lifelingo_refresh');localStorage.removeItem('lifelingo_user')}function enterGame(){const user=localStorage.getItem('lifelingo_user'),access=localStorage.getItem('lifelingo_access');if(!user||!access)return;$('gate').style.display='none';$('game').classList.add('show');if(!$('frame').src)$('frame').src='./v5.html?v=real-auth-1'}async function tryRefresh(){const refreshToken=localStorage.getItem('lifelingo_refresh');if(!refreshToken)return false;try{const result=await req('/api/auth/refresh',{method:'POST',body:JSON.stringify({refreshToken}),headers:{Authorization:''}});saveSession(result);return true}catch{clearSession();return false}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('nameField').style.display=mode==='signup'?'block':'none';$('submit').textContent=mode==='signup'?'Create account':'Log in';$('password').autocomplete=mode==='signup'?'new-password':'current-password';setMsg(mode==='signup'?'Create an account stored in the LifeLingo database.':'Log in with your LifeLingo account.')});$('submit').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value,name=$('name').value.trim();if(!email||password.length<8||mode==='signup'&&name.length<2){setMsg('Enter a valid email, an 8+ character password'+(mode==='signup'?' and your name.':'.'),'err');return}const online=await health();if(!online){setMsg('The backend is ready in GitHub but the hosting account still needs to provision it. Login is intentionally blocked instead of falling back to a fake local account.','err');return}$('submit').classList.add('loading');try{const payload=mode==='signup'?{name,email,password}:{email,password};const result=await req('/api/auth/'+(mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify(payload)});saveSession(result);setMsg(mode==='signup'?'Account created in the database. Entering LifeLingo…':'Logged in securely. Entering LifeLingo…','ok');setTimeout(enterGame,350)}catch(e){setMsg(e.message||'Authentication failed.','err')}finally{$('submit').classList.remove('loading')}};window.addEventListener('storage',async e=>{if(e.key==='lifelingo_user'&&e.newValue===null&&!loggingOut){loggingOut=true;const refreshToken=localStorage.getItem('lifelingo_refresh'),access=localStorage.getItem('lifelingo_access');try{await fetch(API+'/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json',...(access?{Authorization:'Bearer '+access}:{})},body:JSON.stringify(refreshToken?{refreshToken}:{})})}catch{}clearSession();location.reload()}});(async()=>{const online=await health();if(localStorage.getItem('lifelingo_access')&&localStorage.getItem('lifelingo_user')){if(online)enterGame();else setMsg('Your session exists, but the secure API is currently offline.','err')}else if(localStorage.getItem('lifelingo_refresh')&&online){if(await tryRefresh())enterGame()}})();</script></body></html>
