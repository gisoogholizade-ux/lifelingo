<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>LifeLingo Admin</title><style>:root{--bg:#0b1020;--card:#12192d;--text:#f7f8ff;--muted:#96a1bb;--line:#ffffff17;--accent:#ffb515}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.card,.login{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}.login{max-width:430px;margin:10vh auto}.hidden{display:none!important}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#ffb51515;border:1px solid #ffb51544;color:#ffd56b;font-size:12px;font-weight:900}.muted{color:var(--muted)}input,select,button{font:inherit}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:#080d1b;color:white}.btn{border:0;border-radius:12px;padding:11px 13px;background:var(--accent);color:#111827;font-weight:900;cursor:pointer}.ghost{background:#ffffff0a;color:#fff;border:1px solid var(--line)}.top,.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:15px;border-radius:17px;background:#18213a}.stat b{font-size:27px;display:block}.tr{display:grid;grid-template-columns:1.1fr 1fr .7fr 1.2fr;gap:9px;padding:11px 0;border-top:1px solid var(--line);align-items:center}.small{font-size:11px}.msg{min-height:20px;margin-top:10px;color:#ffd56b}@media(max-width:720px){.stats{grid-template-columns:1fr}.tr{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><section id="login" class="login"><span class="pill">LIFELINGO ADMIN</span><h2>Admin sign in</h2><p class="muted">First sign in with your normal LifeLingo email and password.</p><input id="email" type="email" autocomplete="email" placeholder="LifeLingo email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" class="btn" style="width:100%;margin-top:8px">Log in</button><div id="loginMsg" class="msg"></div></section><main id="app" class="wrap hidden"><div class="top"><div><span class="pill">MANUAL SALES MVP</span><h1>LifeLingo Admin</h1></div><div><span id="who" class="muted"></span> <button id="logout" class="btn ghost">Log out</button></div></div><section id="claim" class="card hidden"><h2>One-time admin setup</h2><p class="muted">Your account is signed in, but no administrator exists yet. Enter the bootstrap code once.</p><input id="claimCode" placeholder="Bootstrap code"><button id="claimBtn" class="btn">Activate this account as admin</button><div id="claimMsg" class="msg"></div></section><section id="dashboard" class="hidden"><div class="stats"><div class="stat"><span class="muted">Users</span><b id="userCount">0</b></div><div class="stat"><span class="muted">Pro</span><b id="proCount">0</b></div><div class="stat"><span class="muted">Requests</span><b id="reqCount">0</b></div></div><div class="card"><h2>Users</h2><div id="users"></div></div><div class="card"><h2>Upgrade requests</h2><div id="requests"></div></div></section></main><script src="./supabase-client.js?v=admin2"></script><script>let sb,session;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function ui(signed){$('#login').classList.toggle('hidden',signed);$('#app').classList.toggle('hidden',!signed);if(signed)$('#who').textContent=session?.user?.email||''}async function start(){if(!window.llSupabase){setTimeout(start,60);return}sb=window.llSupabase;const r=await sb.auth.getSession();session=r.data.session;ui(!!session);if(session)await load();sb.auth.onAuthStateChange((_e,s)=>{session=s;ui(!!s);if(s)setTimeout(load,50)})}$('#loginBtn').onclick=async()=>{if(!sb){$('#loginMsg').textContent='Connecting… try again in a moment.';return}const email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(!email||!password){$('#loginMsg').textContent='Enter your LifeLingo email and password.';return}$('#loginBtn').disabled=true;$('#loginMsg').textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email,password});$('#loginBtn').disabled=false;if(error){$('#loginMsg').textContent=error.message;return}session=data.session;ui(true);await load()};$('#logout').onclick=()=>sb.auth.signOut();async function load(){const {data:u,error}=await sb.rpc('admin_users');if(error){$('#dashboard').classList.add('hidden');$('#claim').classList.remove('hidden');$('#claimMsg').textContent='Signed in ✓ Complete the one-time admin setup below.';return}$('#claim').classList.add('hidden');$('#dashboard').classList.remove('hidden');const {data:r}=await sb.rpc('admin_upgrade_requests');render(u||[],r||[])}$('#claimBtn').onclick=async()=>{const code=$('#claimCode').value.trim();if(!code){$('#claimMsg').textContent='Enter the bootstrap code.';return}$('#claimMsg').textContent='Activating…';const {data,error}=await sb.rpc('claim_first_admin',{p_code:code});if(error){$('#claimMsg').textContent=error.message;return}if(!data){$('#claimMsg').textContent='Code is incorrect or an admin already exists.';return}$('#claimMsg').textContent='Admin activated ✓';await load()};function render(users,req){$('#userCount').textContent=users.length;$('#proCount').textContent=users.filter(x=>x.plan==='pro'&&x.status==='active').length;$('#reqCount').textContent=req.filter(x=>['open','contacted','paid'].includes(x.status)).length;$('#users').innerHTML=users.map(u=>`<div class="tr"><div><b>${esc(u.display_name)}</b><div class="muted small">${esc(u.phone||'No phone')}</div></div><div>${u.contact_consent?'Contact allowed':'No call consent'}</div><div><b>${esc(u.plan)}</b></div><div class="row"><select data-days="${u.user_id}" style="max-width:110px"><option value="30">1 month</option><option value="90">3 months</option><option value="180">6 months</option><option value="365">1 year</option></select><button class="btn" data-pro="${u.user_id}">Activate Pro</button></div></div>`).join('')||'<p class="muted">No users.</p>';$('#requests').innerHTML=req.map(r=>`<div class="tr"><div><b>${esc(r.display_name)}</b><div class="muted small">${esc(r.phone||'No phone')}</div></div><div>${esc(r.desired_term)}</div><div>${esc(r.status)}</div><div class="row"><button class="btn ghost" data-status="contacted" data-id="${r.request_id}">Contacted</button><button class="btn" data-activate="${r.user_id}" data-term="${r.desired_term}">Activate</button></div></div>`).join('')||'<p class="muted">No requests yet.</p>'}document.addEventListener('click',async e=>{const p=e.target.closest('[data-pro]');if(p){const uid=p.dataset.pro,days=+document.querySelector(`[data-days="${uid}"]`).value;const {error}=await sb.rpc('admin_activate_pro',{p_user:uid,p_days:days,p_note:'Manual admin activation'});if(error)alert(error.message);else load();return}const s=e.target.closest('[data-status]');if(s){const {error}=await sb.rpc('admin_set_request_status',{p_id:+s.dataset.id,p_status:s.dataset.status});if(error)alert(error.message);else load();return}const a=e.target.closest('[data-activate]');if(a){const days={1_month:30,3_months:90,6_months:180,1_year:365}[a.dataset.term]||30;const {error}=await sb.rpc('admin_activate_pro',{p_user:a.dataset.activate,p_days:days,p_note:'Upgrade request activation'});if(error)alert(error.message);else load()}});start()</script></body></html>
