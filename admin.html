<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>LifeLingo Admin</title><style>:root{--bg:#0b1020;--card:#12192d;--card2:#18213a;--text:#f7f8ff;--muted:#96a1bb;--line:#ffffff17;--accent:#ffb515;--ok:#55d68b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.top h1{margin:0}.pill{padding:8px 11px;border-radius:999px;background:#ffb51515;border:1px solid #ffb51544;color:#ffd56b;font-size:12px;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--card2);border-radius:18px;padding:16px}.stat b{font-size:28px;display:block}.muted{color:var(--muted)}button,input,select{font:inherit}.btn{border:0;border-radius:12px;padding:10px 12px;background:var(--accent);color:#111827;font-weight:900;cursor:pointer}.ghost{background:#ffffff09;color:white;border:1px solid var(--line)}input,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0a0f1e;color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab.on{background:var(--accent);color:#111827}.table{overflow:auto}.tr{display:grid;grid-template-columns:1.15fr 1fr .75fr .65fr 1fr;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--line);min-width:850px}.tr.head{color:var(--muted);font-size:12px;border:0}.badge{display:inline-flex;padding:6px 8px;border-radius:999px;background:#ffffff0b;font-size:11px}.pro{color:#ffd56b;border:1px solid #ffb51544}.ok{color:#8df0b6}.login{max-width:430px;margin:15vh auto;background:var(--card);padding:22px;border-radius:24px;border:1px solid var(--line)}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login"><div class="pill">LIFELINGO ADMIN</div><h2>Sign in</h2><p class="muted">Use your LifeLingo account.</p><input id="email" type="email" placeholder="Email" style="margin-bottom:8px"><input id="password" type="password" placeholder="Password" style="margin-bottom:10px"><button class="btn" id="loginBtn">Log in</button><p id="loginMsg" class="muted"></p></div><main id="app" class="wrap hidden"><div class="top"><div><div class="pill">MANUAL SALES MVP</div><h1>LifeLingo Admin</h1></div><div class="row"><span class="muted" id="who"></span><button class="btn ghost" id="logout">Log out</button></div></div><div id="claim" class="card hidden"><h3>Claim first admin</h3><p class="muted">This is shown only until the first admin is created.</p><div class="row"><input id="claimCode" placeholder="Bootstrap code" style="max-width:300px"><button class="btn" id="claimBtn">Claim admin</button></div><p id="claimMsg" class="muted"></p></div><div id="dashboard" class="hidden"><section class="grid"><div class="stat"><span class="muted">Users</span><b id="userCount">0</b></div><div class="stat"><span class="muted">Pro users</span><b id="proCount">0</b></div><div class="stat"><span class="muted">Open requests</span><b id="reqCount">0</b></div></section><section class="card"><div class="tabs"><button class="btn tab on" data-tab="users">Users</button><button class="btn ghost tab" data-tab="requests">Upgrade requests</button></div><div id="usersTab"><div class="table"><div class="tr head"><span>User</span><span>Phone / consent</span><span>Plan</span><span>Joined</span><span>Action</span></div><div id="users"></div></div></div><div id="requestsTab" class="hidden"><div class="table"><div class="tr head"><span>User</span><span>Phone</span><span>Term</span><span>Status</span><span>Action</span></div><div id="requests"></div></div></div></section></div></main><script src="./supabase-client.js"></script><script>let sb=null,session=null,users=[],requests=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function ready(){if(!window.llSupabase){setTimeout(ready,40);return}sb=llSupabase;boot()}async function boot(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(session){showApp();await load()}sb.auth.onAuthStateChange((_e,s2)=>{session=s2;if(session){showApp();load()}else showLogin()})}function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=session?.user?.email||''}function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden')}$('#loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginMsg').textContent=error?error.message:'Signed in ✓'};$('#logout').onclick=()=>sb.auth.signOut();async function load(){let {data:u,error:ue}=await sb.rpc('admin_users');if(ue){$('#claim').classList.remove('hidden');$('#dashboard').classList.add('hidden');return}users=u||[];let {data:r,error:re}=await sb.rpc('admin_upgrade_requests');requests=re?[]:(r||[]);$('#claim').classList.add('hidden');$('#dashboard').classList.remove('hidden');render()}$('#claimBtn').onclick=async()=>{const {data,error}=await sb.rpc('claim_first_admin',{p_code:$('#claimCode').value.trim()});$('#claimMsg').textContent=error?error.message:data?'Admin access activated ✓':'Invalid code or an admin already exists.';if(data)load()};function render(){$('#userCount').textContent=users.length;$('#proCount').textContent=users.filter(x=>x.plan==='pro'&&x.status==='active'&&(!x.expires_at||new Date(x.expires_at)>new Date())).length;$('#reqCount').textContent=requests.filter(x=>['open','contacted','paid'].includes(x.status)).length;$('#users').innerHTML=users.map(u=>`<div class="tr"><div><b>${esc(u.display_name)}</b><div class="muted" style="font-size:11px">${esc(u.user_id).slice(0,8)}…</div></div><div>${esc(u.phone||'—')}<div class="muted" style="font-size:11px">${u.contact_consent?'contact allowed':'no marketing consent'}</div></div><div><span class="badge ${u.plan==='pro'?'pro':''}">${esc(u.plan)} · ${esc(u.status)}</span>${u.expires_at?`<div class="muted" style="font-size:11px">to ${new Date(u.expires_at).toLocaleDateString()}</div>`:''}</div><div>${new Date(u.created_at).toLocaleDateString()}</div><div class="row"><select data-days="${esc(u.user_id)}" style="width:120px"><option value="30">1 month</option><option value="90">3 months</option><option value="180">6 months</option><option value="365">1 year</option></select><button class="btn" data-pro="${esc(u.user_id)}">Activate Pro</button></div></div>`).join('');$('#requests').innerHTML=requests.map(r=>`<div class="tr"><div><b>${esc(r.display_name)}</b><div class="muted" style="font-size:11px">#${r.request_id}</div></div><div>${esc(r.phone||'—')}</div><div>${esc(r.desired_term)}</div><div><span class="badge">${esc(r.status)}</span></div><div class="row"><button class="btn ghost" data-status="contacted" data-id="${r.request_id}">Contacted</button><button class="btn ghost" data-status="paid" data-id="${r.request_id}">Paid</button><button class="btn" data-activate-request="${esc(r.user_id)}" data-term="${esc(r.desired_term)}">Activate</button></div></div>`).join('')}document.addEventListener('click',async e=>{const p=e.target.closest('[data-pro]');if(p){const uid=p.dataset.pro,days=+document.querySelector(`[data-days="${uid}"]`).value;const {error}=await sb.rpc('admin_activate_pro',{p_user:uid,p_days:days,p_note:'Manual activation from admin panel'});if(!error)load();else alert(error.message);return}const s=e.target.closest('[data-status]');if(s){const {error}=await sb.rpc('admin_set_request_status',{p_id:+s.dataset.id,p_status:s.dataset.status});if(!error)load();else alert(error.message);return}const a=e.target.closest('[data-activate-request]');if(a){const map={1_month:30,3_months:90,6_months:180,1_year:365};const {error}=await sb.rpc('admin_activate_pro',{p_user:a.dataset.activateRequest,p_days:map[a.dataset.term]||30,p_note:'Activated from upgrade request'});if(!error)load();else alert(error.message)}});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('on',x===b);x.classList.toggle('ghost',x!==b)});$('#usersTab').classList.toggle('hidden',b.dataset.tab!=='users');$('#requestsTab').classList.toggle('hidden',b.dataset.tab!=='requests')});ready()</script></body></html>
