name: LifeLingo Auth and Speak Stability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical auth client
        run: |
          node --check supabase-client.js
          node --check lifelingo-auth-session-guard.js
          node --check lifelingo-auth-fix.js
          test "$(grep -Rho 'createClient(' supabase-client.js lifelingo-auth-session-guard.js lifelingo-auth-fix.js v66-app.js v67-speak-fix.js | wc -l)" -eq 1
          grep -q "if(!data.session)" lifelingo-auth-session-guard.js
          grep -q "No profile RPC is called here" lifelingo-auth-session-guard.js
          grep -q "signOut({scope:'global'})" lifelingo-auth-session-guard.js
          grep -q "lifelingo-auth-session-guard.js?v=1" v66.html
      - name: Validate Free Speak access path
        run: |
          node --check v67-speak-fix.js
          grep -Fq "ensureData(!s.free,runId)" v67-speak-fix.js
          grep -q "rpc('my_membership')" v67-speak-fix.js
          grep -q "function waitForSession" v67-speak-fix.js
          grep -q "function cleanupMission" v67-speak-fix.js
          grep -q "const SPEAK_STATES=Object.freeze" v67-speak-fix.js
          grep -q "function assertCurrent" v67-speak-fix.js
          grep -q "function micFallback" v67-speak-fix.js
          grep -q "transition(SPEAK_STATES.READY,'MIC_FALLBACK')" v67-speak-fix.js
          grep -q "const SCENARIO_GENDERS=Object.freeze" v67-speak-fix.js
          grep -q "function chooseVoice" v67-speak-fix.js
          grep -q "const SCENE_GEOMETRY=Object.freeze" lifelingo-premium-speak.js
          grep -q "data.walkableBounds\|dataset.walkableBounds" lifelingo-premium-speak.js
          ! sed -n '/async function ensureData/,/function renderSpeakLanding/p' v67-speak-fix.js | grep -q "get_learning_home"
          ! grep -q "Speaking access check timed out" v67-speak-fix.js
          ! grep -q "translateX(35%)" lifelingo-premium-speak.css
          ! grep -q "state.status='UNAVAILABLE'" v67-speak-fix.js
          ! grep -q "window.llSupabase?.auth.signOut" v67-speak-fix.js
          grep -q "v67-speak-fix.js?v=6" v66.html
          grep -q "lifelingo-premium-speak.js?v=3" v66.html
      - name: Validate Create Account view wiring
        run: |
          grep -q "CREATE_ACCOUNT_CLICK" v66-app.js
          grep -q "t.closest('\[data-authmode\]')" v66-app.js
          test "$(grep -c "#registerBtn').onclick" v66-app.js)" -eq 0
          grep -q "v66-app.js?v=auth-ui-2" v66.html
      - name: Run deterministic Speak regression
        run: |
          npm install --no-save jsdom@26.1.0
          node --test tests/*.test.mjs
