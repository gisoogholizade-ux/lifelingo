name: LifeLingo Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check v66-app.js
          node --check lifelingo-learn-route.js
          node --check v67-nav-bridge.js
          node --check v67-speak-fix.js
          node --check lifelingo-premium-speak.js
          node --check lifelingo-brand-renderer.js
          node --check v69-avatar-system.js
          node --check avatar-legacy-recovery.js
          node --check lifelingo-config.js
          node --check supabase-client.js
          node --check lifelingo-auth-fix.js
          node --check lifelingo-i18n.js
          node --check lifelingo-i18n-dom.js
          node --check lifelingo-fa-completion.js
          node --check lifelingo-frontend-stabilize.js
          node --check lifelingo-course-route-guard.js
          node --check lifelingo-matching-state.js
          node --check scripts/frontend-audit.mjs
      - name: Frontend inventory and locale audit
        run: node scripts/frontend-audit.mjs
      - name: Check unified shell references
        run: |
          grep -q 'lifelingo-unified.css' v66.html
          grep -q 'v67-polish.css' v66.html
          grep -q 'v68-avatar.css' v66.html
          grep -q 'lifelingo-color-system.css' v66.html
          grep -q 'lifelingo-i18n.css' v66.html
          grep -q 'lifelingo-frontend-stabilize.css' v66.html
          grep -q 'lifelingo-premium-speak.css' v66.html
          grep -q 'lifelingo-brand-renderer.css' v66.html
          grep -q 'lifelingo-color-system.css' admin-v2.html
          grep -q 'v69-avatar-system.js' v66.html
          grep -q 'avatar-legacy-recovery.js' v66.html
          grep -q 'lifelingo-config.js' v66.html
          grep -q 'v66-app.js' v66.html
          grep -q 'lifelingo-learn-route.js' v66.html
          grep -q 'v67-nav-bridge.js' v66.html
          grep -q 'lifelingo-course-route-guard.js' v66.html
          grep -q 'v67-speak-fix.js' v66.html
          grep -q 'lifelingo-premium-speak.js' v66.html
          grep -q 'lifelingo-brand-renderer.js' v66.html
          grep -q 'lifelingo-fa-completion.js' v66.html
          grep -q 'lifelingo-frontend-stabilize.js' v66.html
          grep -q 'lifelingo-matching-state.js' v66.html
          grep -q 'openConversationUnit' lifelingo-frontend-stabilize.js
          grep -q 'COURSE_SCENARIO_MAP' v67-speak-fix.js
          grep -q "'c3-conversation':'apartment'" v67-speak-fix.js
          grep -q 'course_unit' lifelingo-frontend-stabilize.js
          grep -q '#speak' v59.html
          ! grep -q 'document.write' v59.html
      - name: Validate premium Speak state machine
        run: |
          grep -q "ENTERING" lifelingo-premium-speak.js
          grep -q "LISTENING" lifelingo-premium-speak.js
          grep -q "THINKING" lifelingo-premium-speak.js
          grep -q "SPEAKING" lifelingo-premium-speak.js
          grep -q "REACTING_POSITIVE" lifelingo-premium-speak.js
          grep -q "REACTING_CONFUSED" lifelingo-premium-speak.js
          grep -q "MISSION_SUCCESS" lifelingo-premium-speak.js
          grep -q "prefers-reduced-motion" lifelingo-premium-speak.css
          grep -q "visibilitychange" lifelingo-premium-speak.js
          grep -q "speakMic" lifelingo-premium-speak.js
          grep -q "speakNpcBody" lifelingo-premium-speak.js
          grep -q "speakCounter" lifelingo-premium-speak.js
          grep -q "v14-officer.svg" lifelingo-premium-speak.js
          grep -q "SCENE_GEOMETRY" lifelingo-premium-speak.js
          grep -q "walkableBounds" lifelingo-premium-speak.js
          grep -q "SCENARIO_GENDERS" v67-speak-fix.js
          grep -q "chooseVoice" v67-speak-fix.js
          ! grep -q "translateX(35%)" lifelingo-premium-speak.css
          grep -q "ll-airport" lifelingo-premium-speak.css
          grep -q "ll-market" lifelingo-premium-speak.css
          grep -q "ll-office" lifelingo-premium-speak.css
      - name: Validate full brand rendering and story export
        run: |
          grep -q 'viewBox="0 0 512 512"' lifelingo-logo-v3.svg
          grep -q "lifelingo-logo-v3.svg" lifelingo-brand-renderer.js
          grep -q "llBrandLogo" lifelingo-brand-renderer.js
          grep -q "drawLogo" lifelingo-brand-renderer.js
          grep -q "1080" lifelingo-brand-renderer.js
          grep -q "1920" lifelingo-brand-renderer.js
          grep -q "QRCode" lifelingo-brand-renderer.js
          grep -q "cfgUrl" lifelingo-brand-renderer.js
          grep -q "object-fit:contain" lifelingo-brand-renderer.css
          grep -q "overflow:visible" lifelingo-brand-renderer.css
          grep -q "window.addEventListener('click'" lifelingo-brand-renderer.js
      - name: Validate Avatar Surprise assets and configuration
        run: |
          test "$(grep -o "gender:'girls'" v69-avatar-system.js | wc -l)" -eq 5
          test "$(grep -o "gender:'boys'" v69-avatar-system.js | wc -l)" -eq 5
          test "$(find assets -maxdepth 1 -type f -name '*.png' | grep -E '(4C99D87A|8C662C59|98B0EBC3|DA3E874A|F131F764|1DCA1D8B|496DCF3B|9BA0896E|B71F29C4|D474CA0C)' | wc -l)" -eq 10
          grep -q "claim_random_avatar" v69-avatar-system.js
          grep -q "recover_legacy_avatar" avatar-legacy-recovery.js
          grep -q "profile_photo_url" supabase/migrations/202609030005_restore_avatar_surprise_profile_photo_separation.sql
          grep -q "avatar_assigned_at" supabase/migrations/202609030007_avatar_identity_hardening.sql
          grep -q "revoke execute" supabase/migrations/202609030008_lock_down_avatar_identity_rpcs.sql
          grep -q "Canonical LifeLingo avatar catalog" supabase/migrations/202609030009_canonical_avatar_catalog.sql
          grep -q "remove_profile_photo" v69-avatar-system.js
          grep -q "1080" v69-avatar-system.js
          grep -q "1920" v69-avatar-system.js
          grep -q "QRCode" v69-avatar-system.js
          grep -q "MY LIFELINGO CONFESSION" v69-avatar-system.js
          grep -q "CONFESSIONS" v69-avatar-system.js
          grep -q "sessionStorage" v69-avatar-system.js
          grep -q "currentSession" v69-avatar-system.js
          grep -q "failedImages" v69-avatar-system.js
          grep -q "auth.getSession" avatar-legacy-recovery.js
          ! grep -q "localhost" lifelingo-config.js
      - name: Validate centralized color identity
        run: |
          grep -q -- '--color-brand-primary: #6c5ce7' lifelingo-color-system.css
          grep -q -- '--color-accent-speaking: #38bdf8' lifelingo-color-system.css
          grep -q -- '--color-accent-streak: #f59e0b' lifelingo-color-system.css
          grep -q -- '--color-success:' lifelingo-color-system.css
          grep -q -- '--color-warning:' lifelingo-color-system.css
          grep -q -- '--color-error:' lifelingo-color-system.css
          grep -q -- '--gradient-brand:' lifelingo-color-system.css
          grep -q 'html\[data-theme="light"\]' lifelingo-color-system.css
      - name: Guard against plaintext password storage
        run: |
          ! grep -RniE 'localStorage.*password|password.*localStorage' v66*.js v67*.js v69*.js lifelingo-*.js avatar-legacy-recovery.js v66.html
      - name: Verify migration files exist
        run: |
          test -f supabase/migrations/202609030003_unified_product_preferences_and_partner_hub.sql
          test -f supabase/migrations/202609030004_protect_premium_legacy_missions.sql
          test -f supabase/migrations/202609030005_restore_avatar_surprise_profile_photo_separation.sql
          test -f supabase/migrations/202609030006_avatar_display_partner_inbox.sql
          test -f supabase/migrations/202609030007_avatar_identity_hardening.sql
          test -f supabase/migrations/202609030008_lock_down_avatar_identity_rpcs.sql
          test -f supabase/migrations/202609030009_canonical_avatar_catalog.sql
          test -f supabase/migrations/202609031120_fix_partner_goal_and_age_matching.sql
          test -f supabase/migrations/202609031230_frontend_stabilization_matching_profile.sql
