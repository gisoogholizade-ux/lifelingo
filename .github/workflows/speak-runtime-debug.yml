name: Speak Runtime Debug

on:
  push:
    paths:
      - '.github/workflows/speak-runtime-debug.yml'
      - '.github/scripts/speak-deadlock-acceptance.mjs'
      - 'lifelingo-premium-speak.js'
      - 'v66.html'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium and WebKit
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run deployed Speak input-deadlock acceptance
        env:
          TARGET_URL: https://gisoogholizade-ux.github.io/lifelingo/
        run: node .github/scripts/speak-deadlock-acceptance.mjs
