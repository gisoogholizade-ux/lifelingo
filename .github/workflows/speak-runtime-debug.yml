name: Speak Runtime Debug

on:
  push:
    paths:
      - '.github/workflows/speak-runtime-debug.yml'
      - '.github/scripts/speak-runtime-proof.mjs'
      - '.github/scripts/speak-airport-isolation.mjs'
      - '.github/scripts/speak-scene-isolation.mjs'
      - '.github/scripts/speak-premium-narrow.mjs'
      - '.github/scripts/speak-premium-sync-split.mjs'
      - '.github/scripts/speak-premium-exact-cause.mjs'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove exact Premium Speak deadlock writer
        run: node .github/scripts/speak-premium-exact-cause.mjs
