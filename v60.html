<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>LifeLingo</title><script>(()=>{const P=Storage.prototype,g=P.getItem,s=P.setItem,r=P.removeItem,mem=new Map(),isLL=k=>String(k).startsWith('lifelingo_');try{const old=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(isLL(k))old.push(k)}old.forEach(k=>r.call(localStorage,k))}catch{}P.getItem=function(k){if(this===localStorage&&isLL(k))return mem.has(String(k))?mem.get(String(k)):null;return g.call(this,k)};P.setItem=function(k,v){if(this===localStorage&&isLL(k)){k=String(k);v=String(v);mem.set(k,v);window.dispatchEvent(new CustomEvent('lifelingo:volatile-set',{detail:{key:k,value:v}}));return}return s.call(this,k,v)};P.removeItem=function(k){if(this===localStorage&&isLL(k)){k=String(k);mem.delete(k);window.dispatchEvent(new CustomEvent('lifelingo:volatile-remove',{detail:{key:k}}));return}return r.call(this,k)};window.LL_VOLATILE_STORAGE={clear(){mem.clear()},setFromServer(obj={}){mem.clear();Object.entries(obj||{}).forEach(([k,v])=>{if(isLL(k))mem.set(String(k),String(v))})},snapshot(){return Object.fromEntries(mem)},has:k=>mem.has(String(k))};})();</script></head><body><script>(async()=>{try{const s=await (await fetch('./v59.html?fresh='+Date.now(),{cache:'no-store'})).text();document.open();document.write(s);document.close()}catch(e){document.body.textContent='Could not load LifeLingo. Refresh.'}})();</script></body></html>
